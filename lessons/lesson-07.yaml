lesson: 7
title: однина й множина · to be · like
video: ""

rule: |
  **Множина.** Зазвичай додаємо **-s**: a book → book**s**, a holiday → holiday**s**.
  Після ch, sh, s, ss, x — **-es**: a watch → watch**es**. Приголосна + y → **-ies**: a dictionary → dictionar**ies**.
  Особливі слова: man → **men**, woman → **women**, person → **people**, tooth → **teeth**. Sheep, fish, deer, bison у множині не змінюються.
  **a / an** — один предмет, будь-який: It's **a** bag. It's **an** apple.
  **the** — конкретний предмет, про який уже знаємо: I see a cat. **The** cat is white. А також те, що існує одне: **the** sun, **the** moon, **the** sky, **the** world.
  **to be** у запитанні стоїть на початку: **Am** I…? **Is** he / she / it…? **Are** you / we / they…?
  Заперечення: I **am not**, he / she / it **is not (isn't)**, you / we / they **are not (aren't)**.
  **like** — подобатися: I like it, але he / she like**s** it.
  **I'd like** (= I would like) — ввічливе «я б хотів»: I'd like a cup of coffee. I'd like **to** + дієслово: I'd like to drink tea.

